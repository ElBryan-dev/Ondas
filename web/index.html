<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ondas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Ondas</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b10;--s1:#15151d;--s2:#1e1e29;--s3:#2a2a37;--tx:#f4f4f8;--mu:#9b9bad;--mu2:#6d6d80;
  --ac:#ff6b4a;--ac2:#ffb347;--ok:#5fd4a0;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --nav:62px;--mini:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.ic{display:block;flex:none}
.muted{color:var(--mu)}
#main{position:absolute;inset:0;bottom:calc(var(--nav) + var(--sb));overflow-y:auto;overflow-x:hidden;padding:calc(var(--st) + 14px) 0 calc(var(--mini) + 20px);-webkit-overflow-scrolling:touch}
.pad{padding:0 16px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:26px 16px 12px}
.top{display:flex;align-items:center;gap:8px;padding:0 16px 6px}
.top h1{flex:1}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--tx)}
.ib:active{background:var(--s2)}
.ib.on{color:var(--ac)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;background:var(--ac);color:#1a0a05;font-weight:800}
.btn.ghost{background:var(--s2);color:var(--tx)}
.chips{display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.chip{padding:8px 15px;border-radius:999px;background:var(--s2);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ac);color:#1a0a05}
/* art */
.art{position:relative;overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;color:rgba(255,255,255,.85);border-radius:6px}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.art img.ld{opacity:1}
.art.sm{width:48px;height:48px;font-size:18px;border-radius:5px}
.art.md{width:56px;height:56px;font-size:20px}
.art.lg{width:100%;aspect-ratio:1;font-size:40px;border-radius:8px}
.art.xl{width:min(62vw,250px);height:min(62vw,250px);font-size:64px;border-radius:8px;box-shadow:0 16px 50px rgba(0,0,0,.55)}
.art.rd{border-radius:50%!important}
/* quick grid */
.qg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 16px 0}
.qi{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:6px;overflow:hidden;height:56px;font-weight:700;font-size:13.5px;text-align:left}
.qi .art{border-radius:0}
.qi span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding-right:8px}
/* horizontal shelves */
.hs{display:flex;gap:14px;overflow-x:auto;padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.card{width:142px;flex:none;text-align:left;scroll-snap-align:start}
.card .ct{font-weight:700;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cs{font-size:12.5px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.ar{text-align:center}
.mix .art{font-size:15px;padding:12px;text-align:left;align-items:end;justify-items:start;line-height:1.15}
/* rows */
.row{display:flex;align-items:center;gap:12px;padding:7px 8px 7px 16px;cursor:pointer;user-select:none}
.row:active{background:var(--s1)}
.ri{flex:1;min-width:0}
.rt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .rt{color:var(--ac)}
.rs{font-size:13px;color:var(--mu);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.rs .t{overflow:hidden;text-overflow:ellipsis}
.rd{font-size:12.5px;color:var(--mu2);font-variant-numeric:tabular-nums}
.num{width:22px;text-align:center;color:var(--mu);font-size:14px;flex:none}
.q{font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:2px 5px;border-radius:3px;background:var(--s3);color:var(--tx);flex:none}
.q.hr{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#1a0a05}
.lk{color:var(--ac);flex:none}
/* detail header */
.dhead{position:relative;padding:calc(var(--st) + 8px) 16px 8px;margin-top:calc(-14px - var(--st));text-align:center}
.dhead::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--hc,#333) 0%,transparent 100%);opacity:.55;z-index:-1}
.dhead .back{position:absolute;left:8px;top:calc(var(--st) + 8px)}
.dhead .art{margin:36px auto 18px}
.dhead h1{font-size:24px;text-align:left}
.dhead p{margin:6px 0 0;text-align:left;font-size:13.5px}
.dbtns{display:flex;align-items:center;gap:6px;margin-top:10px}
.dbtns .sp{flex:1}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#1a0a05;display:grid;place-items:center;box-shadow:0 6px 20px rgba(255,107,74,.35)}
.bigplay:active{transform:scale(.95)}
/* empty */
.empty{padding:40px 24px;text-align:center}
.empty .logo{width:96px;height:96px;margin:10px auto 20px}
.empty h1{font-size:26px;margin-bottom:10px}
.empty p{color:var(--mu);line-height:1.5;margin:0 0 22px}
.empty .btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px;text-align:left}
.feat div{background:var(--s1);border-radius:10px;padding:12px;font-size:13px;color:var(--mu)}
.feat b{display:block;color:var(--tx);margin-bottom:3px;font-size:14px}
/* search */
.sbox{margin:6px 16px 8px;display:flex;align-items:center;gap:10px;background:var(--tx);color:#111;border-radius:8px;padding:0 12px;height:46px}
.sbox input{flex:1;border:0;outline:0;background:none;color:#111;font-size:16px;font-weight:600}
.gen{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.gen button{height:92px;border-radius:8px;padding:12px;text-align:left;font-weight:800;font-size:16px;position:relative;overflow:hidden;align-content:start;display:grid}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);display:flex;background:linear-gradient(180deg,rgba(11,11,16,.85),#0b0b10 40%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--mu)}
#nav button.on{color:var(--tx)}
/* mini player */
#mini{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + var(--sb) + 4px);height:var(--mini);border-radius:10px;background:var(--mc,#2a2a37);display:none;align-items:center;gap:10px;padding:0 6px 0 8px;z-index:21;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:background .5s}
#mini.show{display:flex}
#mini .art{width:46px;height:46px}
#mini .mi{flex:1;min-width:0;cursor:pointer}
#mini .mt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .ms{font-size:12.5px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .bar{position:absolute;left:8px;right:8px;bottom:2px;height:2px;background:rgba(255,255,255,.2);border-radius:2px}
#mini .bar i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
/* full player */
#player{position:fixed;inset:0;z-index:40;background:var(--pc,#222);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1),background .6s;display:flex;flex-direction:column;padding:calc(var(--st) + 8px) 22px calc(var(--sb) + 14px)}
#player::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(11,11,16,.75) 55%,#0b0b10 100%);pointer-events:none}
#player>*{position:relative}
#player.open{transform:none}
.ph{display:flex;align-items:center;gap:8px}
.ph .from{flex:1;text-align:center;font-size:12px;line-height:1.3}
.ph .from b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcov{flex:1;display:grid;place-items:center;min-height:0;padding:18px 0}
.pcov .art{width:min(84vw,46vh,420px);height:min(84vw,46vh,420px);border-radius:10px;font-size:90px;box-shadow:0 24px 60px rgba(0,0,0,.5);transition:transform .3s}
#player.paused .pcov .art{transform:scale(.92)}
.pmeta{display:flex;align-items:center;gap:10px}
.pmeta .tx{flex:1;min-width:0}
.pmeta .pt{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta .pa{font-size:15px;color:rgba(255,255,255,.72);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{margin-top:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.25) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.25)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:#fff}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums;margin-top:2px}
.ctr{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px}
.ctr .pp{width:68px;height:68px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
.ctr .pp:active{transform:scale(.95)}
.ctr .ib{width:48px;height:48px}
.ib.dot{position:relative}
.ib.dot.on::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac)}
.ib .one{position:absolute;font-size:9px;font-weight:800;top:11px;right:9px;color:var(--ac)}
.pbot{display:flex;align-items:center;justify-content:space-between}
.qual{font-size:11px;font-weight:800;letter-spacing:.03em;padding:5px 9px;border-radius:5px;background:rgba(255,255,255,.12)}
.qual.hr{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#1a0a05}
/* lyrics */
#lyr{position:absolute;inset:0;z-index:5;background:var(--pc,#222);display:none;flex-direction:column;padding:calc(var(--st) + 8px) 22px calc(var(--sb) + 14px)}
#lyr.open{display:flex}
#lyr .lb{flex:1;overflow-y:auto;padding:20px 0 40vh;scroll-behavior:smooth}
#lyr .ln{font-size:24px;font-weight:800;line-height:1.35;margin:0 0 16px;color:rgba(255,255,255,.4);transition:color .2s;cursor:pointer}
#lyr .ln.on{color:#fff}
#lyr .plain{white-space:pre-wrap;font-size:19px;font-weight:700;line-height:1.55;color:rgba(255,255,255,.9)}
/* sheets */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--s1);border-radius:16px 16px 0 0;max-height:82vh;overflow-y:auto;padding:8px 0 calc(var(--sb) + 14px);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
#sheet.open{transform:none}
#sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--s3);margin:4px auto 10px}
.sh-h{display:flex;align-items:center;gap:12px;padding:4px 16px 12px;border-bottom:1px solid var(--s2);margin-bottom:6px}
.sh-h .tx{min-width:0;flex:1}
.sh-h b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-h small{color:var(--mu)}
.mitem{display:flex;align-items:center;gap:16px;width:100%;padding:13px 20px;font-size:15.5px;font-weight:600;text-align:left}
.mitem:active{background:var(--s2)}
.mitem.danger{color:#ff7a7a}
.sh-t{font-size:18px;font-weight:800;padding:4px 20px 12px}
.field{display:block;width:calc(100% - 40px);margin:0 20px 16px;padding:14px;border-radius:8px;border:1px solid var(--s3);background:var(--s2);font-size:16px;outline:0}
.field:focus{border-color:var(--ac)}
.sh-btns{display:flex;gap:10px;justify-content:flex-end;padding:0 20px}
.eqrow{display:flex;align-items:center;gap:12px;padding:6px 20px}
.eqrow label{width:44px;font-size:12px;color:var(--mu);font-weight:700}
.eqrow span{width:52px;white-space:nowrap;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.eqrow input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--ac) var(--p),var(--s3) var(--p))}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:var(--s3);transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--ac)}
.sw.on::after{transform:translateX(18px)}
.note{font-size:12.5px;color:var(--mu);padding:4px 20px 10px;line-height:1.45}
.qhead{font-size:13px;color:var(--mu);font-weight:700;padding:10px 16px 4px;text-transform:uppercase;letter-spacing:.06em}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--mini) + var(--sb) + 18px);transform:translateX(-50%) translateY(20px);background:var(--tx);color:#111;padding:11px 16px;border-radius:8px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#drop{position:fixed;inset:0;z-index:90;background:rgba(255,107,74,.18);border:3px dashed var(--ac);display:none;place-items:center;font-size:22px;font-weight:800}
#drop.show{display:grid}
.prog{height:4px;background:var(--s3);border-radius:4px;margin:8px 20px 4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
.stat{padding:4px 20px 12px;font-size:14px;color:var(--mu)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--ac);animation:sp 0.8s linear infinite;margin:10px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{margin:6px 16px 4px;padding:16px;border-radius:12px;background:linear-gradient(135deg,#2a1a17,#1e1e29);display:flex;gap:14px;align-items:center}
.banner .tx{flex:1;font-size:13.5px;color:var(--mu);line-height:1.4}
.banner b{display:block;color:var(--tx);font-size:15.5px;margin-bottom:2px}
.src{font-size:11px;font-weight:700;color:var(--mu);margin:-6px 16px 10px;letter-spacing:.02em}
.desc{padding:4px 16px 0;font-size:13.5px;color:var(--mu);line-height:1.5}
.ok{color:var(--ok)}
/* ===== v2 ===== */
:root{--amb:#3b2a52}
body{background:radial-gradient(150% 60% at 50% -12%,color-mix(in srgb,var(--amb) 75%,transparent) 0%,transparent 60%),var(--bg);transition:background .8s}
h1{font-size:30px}
h2{display:flex;align-items:center;gap:8px}
h2 .more{margin-left:auto;font-size:13px;font-weight:700;color:var(--mu);display:inline-flex;align-items:center;gap:4px;padding:4px 0}
.sbox{background:rgba(255,255,255,.08);color:var(--tx);border:1.5px solid rgba(255,255,255,.06);border-radius:14px;height:52px;transition:border-color .2s,background .2s}
.sbox:focus-within{border-color:var(--ac);background:rgba(255,255,255,.11)}
.sbox input{color:var(--tx);font-weight:600}
.sbox input::placeholder{color:var(--mu2)}
.sbox .clr{width:34px;height:34px;color:var(--mu)}
input[type=search]::-webkit-search-cancel-button{display:none}
.card .art.lg{border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.card,.qi,.row,.rank,.topres,.gen button{transition:transform .12s}
.card:active,.qi:active,.row:active,.rank:active,.topres:active,.gen button:active{transform:scale(.97)}
.qi{border-radius:10px;background:rgba(255,255,255,.08)}
#mini{background:color-mix(in srgb,var(--mc,#2a2a37) 72%,rgba(14,14,20,.55));backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.08);border-radius:14px}
#nav button.on{color:var(--ac)}
.nowbars{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:7px;vertical-align:-1px}
.nowbars i{width:3px;height:4px;background:var(--ac);border-radius:2px;animation:nb .9s ease-in-out infinite}
.nowbars i:nth-child(2){animation-delay:-.3s}.nowbars i:nth-child(3){animation-delay:-.6s}
@keyframes nb{0%,100%{height:3px}50%{height:12px}}
body.paused .nowbars i{animation-play-state:paused}
.rank{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 10px;cursor:pointer}
.rank.cur .rt{color:var(--ac)}
.rn{width:30px;text-align:center;font-size:21px;font-weight:800;background:linear-gradient(180deg,var(--ac2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}
.topres{margin:6px 16px 4px;padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(255,107,74,.22),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.07);display:flex;gap:14px;align-items:center;cursor:pointer;position:relative}
.topres .art{width:92px;height:92px;border-radius:12px;font-size:36px;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.topres .ri{padding-right:52px}
.topres .tl{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--ac);margin-bottom:4px}
.topres .tt{font-size:20px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.topres .ts{font-size:13px;color:rgba(255,255,255,.72);margin-top:4px}
.topres .bigplay{position:absolute;right:14px;bottom:14px;width:46px;height:46px}
.sug{padding:2px 0 6px}
.sgi{display:flex;align-items:center;gap:14px;padding:11px 16px 11px 18px;font-size:15.5px;font-weight:600;width:100%;text-align:left}
.sgi:active{background:rgba(255,255,255,.05)}
.sgi>.ic,.sgl>.ic{color:var(--mu);flex:none}
.sgi .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgi .x{color:var(--mu2)}
.sgl{display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-align:left}
.flacnote{margin:4px 16px 8px;padding:16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);font-size:13.5px;color:var(--mu);line-height:1.5}
.flacnote b{color:var(--tx)}
.flacnote .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn.sm{padding:9px 14px;font-size:13.5px;gap:6px}
.lnk{color:var(--ac);font-weight:700;text-decoration:underline}
.ib.dl{color:var(--mu)}.ib.dl.ok{color:var(--ok)}
.minispin{width:18px;height:18px;border-radius:50%;border:2px solid var(--s3);border-top-color:var(--ac);animation:sp .8s linear infinite}
.gen button{border-radius:14px;height:96px;font-size:17px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.gen button .ic{position:absolute;right:-6px;bottom:-6px;opacity:.35;transform:rotate(18deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;padding:0 16px}
.grid .card{width:auto}
.sect-sk{height:58px;margin:8px 16px;border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
/* ===== reproductor v2 ===== */
#player{overflow:hidden;padding-left:24px;padding-right:24px}
#player::before{display:none}
#pbg{position:absolute!important;inset:-15%;background-size:cover;background-position:center;filter:blur(60px) saturate(1.6) brightness(.8);transform:scale(1.15);opacity:.9;z-index:0;transition:opacity .6s}
#pbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,16,.15) 0%,rgba(11,11,16,.55) 50%,rgba(11,11,16,.95) 85%)}
#player>*:not(#pbg){position:relative;z-index:1}
.pcov .art{border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);touch-action:pan-y}
.pmeta .pt{font-size:25px;letter-spacing:-.01em}
#seek{height:24px}
#seek::-webkit-slider-runnable-track{height:5px;background:linear-gradient(90deg,var(--ac) var(--p),rgba(255,255,255,.22) var(--p))}
#seek::-webkit-slider-thumb{width:16px;height:16px;margin-top:-5.5px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.ctr .pp{width:76px;height:76px;background:var(--ac);color:#1a0a05;box-shadow:0 12px 34px rgba(255,107,74,.45)}
.pbot .ib{width:40px;height:40px}
.qual{white-space:nowrap;font-size:10.5px}
.pnext{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.09);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13.5px;text-align:left;width:100%}
.pnext .nx{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--ac);flex:none}
.pnext b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.pnext .nxq{color:var(--mu);flex:none}
@media (max-height:700px){.pnext{display:none}}
@media (min-width:900px){
  #main{padding-left:max(16px,calc(50vw - 520px));padding-right:max(16px,calc(50vw - 520px))}

  .qg{grid-template-columns:repeat(3,1fr)}
  .gen{grid-template-columns:repeat(4,1fr)}
  #mini{left:50%;width:min(760px,calc(100vw - 16px));transform:translateX(-50%)}
}

<script>

 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 arrowup:'<path d="M17 17L7 7M7 15V7h8"/>'
};
const ic=(n,s=24)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));
document.querySelectorAll('#player button, #lyr button').forEach(b=>{b.innerHTML=b.innerHTML.replace(/__(\w+)__/g,(m,n)=>ic(n,n==='down'?28:n==='queue'&&b.classList.contains('pnext')?18:22))});

/* ================= Utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);const m=Math.floor(s/60),r=s%60,h=Math.floor(m/60);return h?`${h}:${String(m%60).padStart(2,'0')}:${String(r).padStart(2,'0')}`:`${m}:${String(r).padStart(2,'0')}`};
const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hue=s=>hash(s)%360;
const shuffleArr=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let toastT;function toast(m,ms=2400){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}

/* ================= Storage (IndexedDB) ================= */
let db=null;const mem={audio:new Map(),covers:new Map()};
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('ondas-music',1);r.onupgradeneeded=()=>{const d=r.result;['tracks','audio','covers','kv'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>{db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})}
function idb(store,mode,fn){return new Promise((res,rej)=>{if(!db)return res(undefined);try{const r=fn(db.transaction(store,mode).objectStore(store));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
const put=(s,k,v)=>idb(s,'readwrite',o=>o.put(v,k)).catch(e=>{console.warn(e);if(String(e&&e.name).includes('Quota'))toast('Sin espacio de almacenamiento');throw e});
const get=(s,k)=>idb(s,'readonly',o=>o.get(k)).catch(()=>undefined);
const del=(s,k)=>idb(s,'readwrite',o=>o.delete(k)).catch(()=>{});
const getAll=s=>idb(s,'readonly',o=>o.getAll()).catch(()=>[]);
async function saveKV(k){const v={likes:[...state.likes],playlists:state.playlists,recent:state.recent,settings:state.settings,hist:state.hist}[k];if(db)put('kv',k,v).catch(()=>{});if(k!=='settings'&&k!=='hist')saveRemote()}
async function getAudio(id){if(mem.audio.has(id))return mem.audio.get(id);return await get('audio',id)}
const coverURLs=new Map();
async function coverURL(id){if(!id)return null;if(/^https?:/.test(id))return id;if(coverURLs.has(id))return coverURLs.get(id);let b=mem.covers.get(id);if(!b)b=await get('covers',id);if(!b)return null;const u=URL.createObjectURL(b);coverURLs.set(id,u);return u}

/* ================= State ================= */
const state={tracks:[],byId:new Map(),likes:new Set(),playlists:[],recent:[],settings:{eqOn:false,gains:Array(10).fill(0),preset:'Plano',vol:1,server:'',key:'',autoplay:true},api:null,apiState:'checking',searchSrc:null,hist:[],sq:null,sTab:'all',
 stack:[{name:'home'}],tab:'home',libTab:'playlists',libSort:'recent',queue:[],orig:null,qi:-1,source:'',shuffle:false,repeat:'off',ctx:{}};
let libCache=null;const invalidate=()=>{libCache=null};
function lib(){if(libCache)return libCache;const albums=new Map(),artists=new Map(),genres=new Map();
 for(const t of state.tracks){const aa=t.albumArtist||t.artist;const k=(aa+'|'+t.album).toLowerCase();
  if(!albums.has(k))albums.set(k,{key:k,name:t.album,artist:aa,year:t.year,coverId:t.coverId,ids:[],added:t.added});
  const al=albums.get(k);al.ids.push(t.id);if(!al.coverId&&t.coverId)al.coverId=t.coverId;if(!al.year&&t.year)al.year=t.year;al.added=Math.max(al.added,t.added);
  const ak=aa.toLowerCase();if(!artists.has(ak))artists.set(ak,{key:ak,name:aa,ids:[],coverId:t.coverId});const ar=artists.get(ak);ar.ids.push(t.id);if(!ar.coverId)ar.coverId=t.coverId;
  if(t.genre){for(const g of t.genre.split(/[;,/]/).map(x=>x.trim()).filter(Boolean)){const gk=g.toLowerCase();if(!genres.has(gk))genres.set(gk,{key:gk,name:g,ids:[]});genres.get(gk).ids.push(t.id)}}}
 const byNo=(x,y)=>{const a=state.byId.get(x),b=state.byId.get(y);return (a.discNo-b.discNo)||(a.trackNo-b.trackNo)||a.title.localeCompare(b.title)};
 for(const al of albums.values())al.ids.sort(byNo);
 for(const ar of artists.values())ar.ids.sort((x,y)=>{const a=state.byId.get(x),b=state.byId.get(y);return (b.year||0)-(a.year||0)||a.album.localeCompare(b.album)||byNo(x,y)});
 const coll=new Intl.Collator('es',{sensitivity:'base'});
 libCache={albums:[...albums.values()].sort((a,b)=>coll.compare(a.name,b.name)),albumMap:albums,artists:[...artists.values()].sort((a,b)=>coll.compare(a.name,b.name)),artistMap:artists,genres:[...genres.values()].sort((a,b)=>b.ids.length-a.ids.length)};
 return libCache}
const isHR=t=>t&&(t.bits>16||t.sampleRate>48000);
const curId=()=>state.queue[state.qi];
const cur=()=>state.byId.get(curId());

/* ================= Metadata parsing ================= */
const rd=async(f,a,b)=>new Uint8Array(await f.slice(a,b).arrayBuffer());
async function parseFLAC(file){
 let off=0;let h=await rd(file,0,10);
 if(h[0]===0x49&&h[1]===0x44&&h[2]===0x33){off=10+(((h[6]&0x7f)<<21)|((h[7]&0x7f)<<14)|((h[8]&0x7f)<<7)|(h[9]&0x7f));h=await rd(file,off,off+4)}
 if(String.fromCharCode(h[0],h[1],h[2],h[3])!=='fLaC')return null;
 off+=4;const m={tags:{},format:'FLAC'};let last=false,guard=0;
 while(!last&&off<file.size&&guard++<64){const bh=await rd(file,off,off+4);if(bh.length<4)break;
  last=!!(bh[0]&0x80);const type=bh[0]&0x7f;const len=(bh[1]<<16)|(bh[2]<<8)|bh[3];off+=4;
  if(type===0||type===4||type===6){const b=await rd(file,off,off+len);const dv=new DataView(b.buffer);
   try{
   if(type===0){const sr=(b[10]<<12)|(b[11]<<4)|(b[12]>>4);m.sampleRate=sr;m.channels=((b[12]>>1)&7)+1;m.bits=(((b[12]&1)<<4)|(b[13]>>4))+1;
    const total=(b[13]&0x0f)*4294967296+b[14]*16777216+(b[15]<<16)+(b[16]<<8)+b[17];m.duration=sr?total/sr:0}
   else if(type===4){let p=0;const vl=dv.getUint32(p,true);p+=4+vl;const n=dv.getUint32(p,true);p+=4;const dec=new TextDecoder('utf-8');
    for(let i=0;i<n&&p+4<=len;i++){const l=dv.getUint32(p,true);p+=4;const s=dec.decode(b.subarray(p,p+l));p+=l;const e=s.indexOf('=');if(e>0){const k=s.slice(0,e).toUpperCase();if(!(k in m.tags))m.tags[k]=s.slice(e+1)}}}
   else if(type===6){let p=0;const pt=dv.getUint32(p);p+=4;const ml=dv.getUint32(p);p+=4;const mime=new TextDecoder().decode(b.subarray(p,p+ml));p+=ml;const dl=dv.getUint32(p);p+=4+dl+16;const pl=dv.getUint32(p);p+=4;
    if(!m.picture||pt===3)m.picture=new Blob([b.slice(p,p+pl)],{type:mime.includes('/')?mime:'image/jpeg'})}
   }catch(e){console.warn('flac block',type,e)}}
  off+=len}
 const t=m.tags;m.title=t.TITLE;m.artist=t.ARTIST;m.album=t.ALBUM;m.albumArtist=t.ALBUMARTIST||t['ALBUM ARTIST'];m.trackNo=t.TRACKNUMBER;m.discNo=t.DISCNUMBER;m.year=t.DATE||t.YEAR;m.genre=t.GENRE;m.lyrics=t.LYRICS||t.UNSYNCEDLYRICS||t.SYNCEDLYRICS;
 return m}
function decT(enc,b){if(enc===1||enc===2){while(b.length>=2&&b[b.length-1]===0&&b[b.length-2]===0)b=b.subarray(0,b.length-2)}else{while(b.length&&b[b.length-1]===0)b=b.subarray(0,b.length-1)}try{if(enc===0)return new TextDecoder('iso-8859-1').decode(b);if(enc===3)return new TextDecoder('utf-8').decode(b);if(enc===2)return new TextDecoder('utf-16be').decode(b);
 if(b[0]===0xFE&&b[1]===0xFF)return new TextDecoder('utf-16be').decode(b.subarray(2));if(b[0]===0xFF&&b[1]===0xFE)return new TextDecoder('utf-16le').decode(b.subarray(2));return new TextDecoder('utf-16le').decode(b)}catch(e){return ''}}
async function parseID3(file){const h=await rd(file,0,10);if(!(h[0]===0x49&&h[1]===0x44&&h[2]===0x33))return null;
 const ver=h[3];const ss=(b,p)=>((b[p]&0x7f)<<21)|((b[p+1]&0x7f)<<14)|((b[p+2]&0x7f)<<7)|(b[p+3]&0x7f);const be=(b,p)=>((b[p]<<24)|(b[p+1]<<16)|(b[p+2]<<8)|b[p+3])>>>0;
 const size=ss(h,6);const b=await rd(file,10,10+size);const m={tags:{},format:'MP3'};let p=0;if(ver<3)return m;
 if(h[5]&0x40)p=ver===4?ss(b,0):be(b,0)+4;
 const map={TIT2:'title',TPE1:'artist',TALB:'album',TPE2:'albumArtist',TRCK:'trackNo',TPOS:'discNo',TYER:'year',TDRC:'year',TCON:'genre'};
 while(p+10<=b.length){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
  const fs=ver===4?ss(b,p+4):be(b,p+4);p+=10;if(fs<=0||p+fs>b.length)break;const d=b.subarray(p,p+fs);p+=fs;
  if(map[id]){m[map[id]]=decT(d[0],d.subarray(1)).replace(/\0/g,' / ')}
  else if(id==='APIC'){const enc=d[0];let q=1;while(q<d.length&&d[q]!==0)q++;let mime=new TextDecoder('iso-8859-1').decode(d.subarray(1,q));q++;q++;
   if(enc===1||enc===2){while(q+1<d.length&&!(d[q]===0&&d[q+1]===0))q+=2;q+=2}else{while(q<d.length&&d[q]!==0)q++;q++}
   if(!mime.includes('/'))mime='image/'+(mime.toLowerCase()||'jpeg');if(!m.picture)m.picture=new Blob([d.slice(q)],{type:mime})}
  else if(id==='USLT'){const enc=d[0];let q=4;if(enc===1||enc===2){while(q+1<d.length&&!(d[q]===0&&d[q+1]===0))q+=2;q+=2}else{while(q<d.length&&d[q]!==0)q++;q++}m.lyrics=decT(enc,d.subarray(q))}}

function probeDuration(blob){return new Promise(res=>{const a=new Audio();const u=URL.createObjectURL(blob);let done=false;const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(u);a.removeAttribute('src');res(v)};a.preload='metadata';a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:0);a.onerror=()=>fin(-1);setTimeout(()=>fin(0),10000);a.src=u})}
async function coverKey(blob){const h=await rd(blob,0,Math.min(4096,blob.size));let x=2166136261;for(let i=0;i<h.length;i++){x^=h[i];x=Math.imul(x,16777619)}return 'c'+blob.size.toString(36)+(x>>>0).toString(36)}
const AUDIO_RE=/\.(flac|mp3|m4a|aac|alac|ogg|oga|opus|wav|aif|aiff|webm)$/i;

/* ================= Import ================= */
let importing=false;
async function importFiles(list){
 const files=[...list];const lrcs=new Map();
 for(const f of files)if(/\.lrc$/i.test(f.name))lrcs.set(f.name.replace(/\.lrc$/i,'').toLowerCase(),f);
 const auds=files.filter(f=>AUDIO_RE.test(f.name)||(f.type&&f.type.startsWith('audio/')));
 if(!auds.length){if(lrcs.size)await attachLrcs(lrcs);else toast('No se encontraron archivos de audio');return}
 if(importing){toast('Ya hay una importación en curso');return}
 importing=true;const existing=new Set(state.tracks.map(t=>t.fileName+'|'+t.size));
 openSheet(`<div class="sh-t">Importando música</div><div class="prog"><i id="ip"></i></div><div class="stat" id="is">Preparando…</div>`,{lock:true});
 let ok=0,skip=0,bad=0;
 for(let i=0;i<auds.length;i++){const f=auds[i];const sEl=$('#is'),pEl=$('#ip');if(sEl)sEl.textContent=`${i+1} de ${auds.length} · ${f.name}`;if(pEl)pEl.style.width=((i/auds.length)*100)+'%';
  if(existing.has(f.name+'|'+f.size)){skip++;continue}
  try{let m=null;if(/\.flac$/i.test(f.name)||f.type==='audio/flac'||f.type==='audio/x-flac')m=await parseFLAC(f);if(!m)m=await parseID3(f);if(!m)m={tags:{}};
   if(!m.format){const ext=(f.name.split('.').pop()||'').toUpperCase();m.format=ext==='M4A'?'AAC/ALAC':ext}
   let dur=m.duration;if(!dur){dur=await probeDuration(f);if(dur<0){bad++;continue}}
   const base=f.name.replace(/\.[^.]+$/,'');let ft=base,fa='';const mm=base.match(/^(?:\d+[\s.\-_]+)?(.+?)\s+-\s+(.+)$/);if(mm){fa=mm[1];ft=mm[2]}else ft=base.replace(/^\d+[\s.\-_]+/,'');
   const dir=(f.webkitRelativePath||'').split('/');
   const t={id:uid('t'),title:(m.title||ft).trim(),artist:(m.artist||fa||'Artista desconocido').trim(),album:(m.album||(dir.length>2?dir[dir.length-2]:'')||'Sin álbum').trim(),
    albumArtist:(m.albumArtist||'').trim(),trackNo:parseInt(m.trackNo)||0,discNo:parseInt(m.discNo)||1,year:parseInt(String(m.year||'').slice(0,4))||0,genre:(m.genre||'').trim(),
    duration:dur||0,format:m.format,sampleRate:m.sampleRate||0,bits:m.bits||0,channels:m.channels||0,size:f.size,fileName:f.name,mime:f.type||(/\.flac$/i.test(f.name)?'audio/flac':''),coverId:null,lyrics:m.lyrics||'',added:Date.now()+i};
   if(m.picture&&m.picture.size>100){const ck=await coverKey(m.picture);t.coverId=ck;if(!coverURLs.has(ck)){if(db){if(!(await get('covers',ck)))await put('covers',ck,m.picture)}else mem.covers.set(ck,m.picture)}}
   const lf=lrcs.get(base.toLowerCase());if(lf)t.lyrics=await lf.text();
   if(db){await put('audio',t.id,f);await put('tracks',t.id,t)}else mem.audio.set(t.id,f);
   state.tracks.push(t);state.byId.set(t.id,t);existing.add(f.name+'|'+f.size);ok++;
  }catch(e){console.error(e);bad++;if(String(e&&e.name).includes('Quota'))break}}
 importing=false;invalidate();closeSheet(true);render();
 toast(`${ok} canción${ok===1?'':'es'} añadida${ok===1?'':'s'}`+(skip?` · ${skip} repetidas`:'')+(bad?` · ${bad} con error`:''),3500);
 if(ok&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
async function attachLrcs(lrcs){let n=0;for(const t of state.tracks){const f=lrcs.get(t.fileName.replace(/\.[^.]+$/,'').toLowerCase());if(f){t.lyrics=await f.text();if(db)put('tracks',t.id,t).catch(()=>{});n++}}toast(n?`Letras añadidas a ${n} canciones`:'Ninguna letra coincidió con tus canciones')}

/* ================= Art ================= */
function art(coverId,seed,size,round,label){const h=hue(seed||'x');const ini=esc((label??seed??'?').trim().charAt(0).toUpperCase()||'♪');
 const img=coverId?(/^https?:/.test(coverId)?`<img alt="" referrerpolicy="no-referrer" loading="lazy" data-url="${esc(coverId)}">`:`<img alt="" data-cover="${coverId}">`):'';
 return `<div class="art ${size}${round?' rd':''}" style="background:linear-gradient(135deg,hsl(${h},55%,42%),hsl(${(h+50)%360},60%,18%))">${ini}${img}</div>`}
function hydrate(root){root.querySelectorAll('img[data-url]:not([src])').forEach(im=>{im.onload=()=>im.classList.add('ld');im.onerror=()=>im.remove();im.src=im.dataset.url});root.querySelectorAll('img[data-cover]:not([src])').forEach(async im=>{const u=await coverURL(im.dataset.cover);if(u){im.onload=()=>im.classList.add('ld');im.src=u}})}
const avgCache=new Map();
async function avgColor(coverId,seed){if(coverId&&avgCache.has(coverId))return avgCache.get(coverId);const h=hue(seed||'x');let c=`hsl(${h},45%,28%)`;
 if(coverId){const u=await coverURL(coverId);if(u){try{const im=new Image();if(/^https?:/.test(u)){im.crossOrigin='anonymous';im.referrerPolicy='no-referrer'}im.src=u;await im.decode();const cv=document.createElement('canvas');cv.width=cv.height=12;const g=cv.getContext('2d');g.drawImage(im,0,0,12,12);const d=g.getImageData(0,0,12,12).data;let r=0,gg=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];b+=d[i+2]}const n=d.length/4;r/=n;gg/=n;b/=n;
  const mx=Math.max(r,gg,b),k=mx>0?Math.min(1.2,150/mx):1;c=`rgb(${Math.round(r*k*.75)},${Math.round(gg*k*.75)},${Math.round(b*k*.75)})`;avgCache.set(coverId,c)}catch(e){}}}
 return c}

function row(t,i,ctx,opt={}){if(!t)return '';return `<div class="row${curId()===t.id?' cur':''}" data-act="play" data-ctx="${ctx}" data-i="${i}">

function parseLRC(txt){const out=[];const re=/\[(\d+):(\d+(?:[.:]\d+)?)\]/g;for(const line of String(txt).split(/\r?\n/)){const times=[];let m;re.lastIndex=0;while((m=re.exec(line)))times.push(+m[1]*60+parseFloat(m[2].replace(':','.')));const text=line.replace(/\[[^\]]*\]/g,'').trim();for(const t of times)out.push({t,text})}return out.sort((a,b)=>a.t-b.t)}

 if(!t.lyrics&&t.source==='yt'&&state.api&&!t._lyrTried&&$('#lyr').classList.contains('open')){t._lyrTried=true;lrc=null;b.innerHTML='<div class="empty"><div class="spin"></div><p>Buscando letra…</p></div>';
  api('/api/lyrics/'+t.rid).then(d=>{if(d&&d.lyrics){t.lyrics=d.lyrics;saveRemote()}}).catch(()=>{}).finally(()=>{if(cur()===t)renderLyrics()});return}
 if(!t.lyrics){lrc=null;b.innerHTML=`<div class="empty"><p>No hay letra para esta canción.</p><button class="btn ghost" data-act="lrcfile">${ic('upload',18)}Cargar archivo .lrc</button><p class="note" style="margin-top:14px">Consejo: importa los .lrc junto con tus canciones (mismo nombre de archivo) y se asociarán solos.</p></div>`;return}
 const p=parseLRC(t.lyrics);if(p.length>2){lrc=p;b.innerHTML=p.map((l,i)=>`<p class="ln" data-act="lseek" data-t="${l.t}" data-i="${i}">${esc(l.text)||'♪'}</p>`).join('')}else{lrc=null;b.innerHTML=`<div class="plain">${esc(t.lyrics)}</div>`}}
function syncLyrics(time){if(!lrc||!$('#lyr').classList.contains('open'))return;let i=-1;for(let k=0;k<lrc.length;k++){if(lrc[k].t<=time+.25)i=k;else break}
 if(i!==lrcIdx){const b=$('#lB');const ls=b.querySelectorAll('.ln');if(ls[lrcIdx])ls[lrcIdx].classList.remove('on');lrcIdx=i;if(ls[i]){ls[i].classList.add('on');b.scrollTop=ls[i].offsetTop-b.clientHeight*.35}}}

 if(wasCur){audio.pause();audio.removeAttribute('src');if(state.queue.length)loadTrack(Math.min(state.qi,state.queue.length-1),false);else{state.qi=-1;updateUI()}}

  const ens=[...items].map(i=>i.webkitGetAsEntry()).filter(Boolean);for(const en of ens)await walk(en);files=files.filter(Boolean)}else files=[...e.dataTransfer.files];

const ytFmt=()=>{const apple=/iP(hone|ad|od)/.test(navigator.userAgent)||((navigator.vendor||'').includes('Apple')&&!/Chrome|Android/.test(navigator.userAgent));
 return !apple&&audio.canPlayType('audio/webm; codecs="opus"')?'opus':'m4a'};

async function api(path,timeout=30000){
 if(NATIVE)return OndasBridge.api(path);
 if(!state.api)throw new Error('Conecta el servidor de catálogo en Ajustes');
 const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),timeout);
 try{const r=await fetch(state.api+path,{headers:state.settings.key?{'X-Ondas-Key':state.settings.key}:{},signal:ctl.signal});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.detail||j.error||('Error del servidor ('+r.status+')'))}
  return await r.json()}
 catch(e){if(e.name==='AbortError')throw new Error('El servidor tardó demasiado en responder');if(e instanceof TypeError)throw new Error('No se pudo conectar con el servidor');throw e}
 finally{clearTimeout(tm)}}
async function cget(key,fn){if(remoteCache.has(key))return remoteCache.get(key);const d=await fn();remoteCache.set(key,d);return d}

async function detectServer(slow){
 if(NATIVE){state.api='native';state.apiInfo={native:true};state.apiState='ok';return state.api}
 const cands=[];if(state.settings.server)cands.push(state.settings.server.replace(/\/+$/,''));
 else if(/^https?:$/.test(location.protocol))cands.push((location.origin+location.pathname).replace(/\/[^/]*$/,''));
 state.api=null;state.apiState='checking';
 for(const c of cands){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),state.settings.server||slow?75000:8000);
  const r=await fetch(c+'/api/health',{signal:ctl.signal});clearTimeout(tm);if(r.ok){const j=await r.json();if(j&&j.app==='ondas'){state.api=c;state.apiInfo=j;break}}}catch(e){}}
 state.apiState=state.api?'ok':'off';return state.api}

function reg(t){const old=state.byId.get(t.id);if(old){for(const k of['offline','lyrics','size','added','_lyrTried'])if(old[k]!==undefined&&t[k]===undefined)t[k]=old[k];Object.assign(old,t);return old}t.added=Date.now();state.byId.set(t.id,t);return t}

 return reg({id:'yt:'+s.id,source:'yt',rid:s.id,title:s.title||'',artist:s.artist||'',artistId:a0.id||null,album:s.album||'',albumId:s.albumId||null,duration:s.duration||0,coverId:s.thumb||null,format:'YouTube',explicit:!!s.explicit,trackNo:s.trackNo||0})}
function iaTrack(o){return reg({id:'ia:'+o.iaId+'/'+o.file,source:'ia',iaId:o.iaId,file:o.file,title:o.title,artist:o.artist||'',album:o.album||'',year:parseInt(o.year)||0,duration:o.duration||0,coverId:o.thumb,format:'FLAC',bits:o.bits||16,sampleRate:0,trackNo:o.trackNo||0})}
let srT;function saveRemote(){clearTimeout(srT);srT=setTimeout(()=>{const keep=new Set([...state.likes,...state.recent,...state.queue]);state.playlists.forEach(p=>p.ids.forEach(i=>keep.add(i)));
 const out=[];for(const[id,t]of state.byId)if(isRemote(t)&&(keep.has(id)||t.offline)){const{_lyrTried,...c}=t;out.push(c)}if(db)put('kv','remote',out).catch(()=>{})},800)}

 state.queue.push(...add);if(state.orig)state.orig.push(...add);saveSession();prefetchNext();updateUI();if(add.length)toast('Radio: '+add.length+' canciones similares',1600);return add.length}catch(e){toast(e.message);return 0}}

/* Internet Archive (FLAC libre) */
async function iaJSON(url){if(NATIVE)return OndasBridge.fetchJSON(url);try{const r=await fetch(url);if(!r.ok)throw new Error('ia '+r.status);return await r.json()}
 catch(e){if(state.api)return api('/api/ia?u='+encodeURIComponent(url));throw new Error('No se pudo conectar con Internet Archive')}}
const one=v=>Array.isArray(v)?v[0]:v;
async function iaSearch(q,rows=30,raw){const query=raw||`(${q}) AND mediatype:audio AND format:(Flac OR "24bit Flac")`;
 const url=`https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&fl%5B%5D=date&fl%5B%5D=format&rows=${rows}&page=1&output=json&sort%5B%5D=downloads+desc`;
 const j=await iaJSON(url);return((j.response||{}).docs||[]).map(d=>({id:d.identifier,title:one(d.title)||d.identifier,artist:one(d.creator)||'',year:String(one(d.date)||'').slice(0,4),hr:[].concat(d.format||[]).includes('24bit Flac'),thumb:`https://archive.org/services/img/${encodeURIComponent(d.identifier)}`}))}
const secsLen=v=>{if(!v)return 0;if(String(v).includes(':')){let t=0;for(const x of String(v).split(':'))t=t*60+parseFloat(x||0);return t}return parseFloat(v)||0};
async function iaItem(id){const j=await iaJSON(`https://archive.org/metadata/${encodeURIComponent(id)}`);if(!j||!j.files)throw new Error('No se encontró este elemento');
 const m=j.metadata||{};const artist=one(m.creator)||one(m.artist)||'';const title=one(m.title)||id;const year=String(one(m.date)||one(m.year)||'').slice(0,4);
 let fl=j.files.filter(f=>/flac/i.test(f.format||'')||/\.flac$/i.test(f.name||''));const orig=fl.filter(f=>f.source==='original');if(orig.length)fl=orig;
 const num=f=>parseInt(String(f.track||'').split('/')[0])||0;fl.sort((a,b)=>(num(a)-num(b))||a.name.localeCompare(b.name,undefined,{numeric:true}));
 const thumb=`https://archive.org/services/img/${encodeURIComponent(id)}`;
 const tracks=fl.map((f,i)=>iaTrack({iaId:id,file:f.name,title:one(f.title)||f.name.split('/').pop().replace(/\.flac$/i,''),artist:one(f.creator)||one(f.artist)||artist,album:one(f.album)||title,year,duration:secsLen(f.length),thumb,bits:/24bit/i.test(f.format||'')?24:16,trackNo:num(f)||i+1}));
 const desc=String(one(m.description)||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
 return{id,title,artist,year,thumb,hr:tracks.some(t=>t.bits>16),tracks,desc,license:one(m.licenseurl)||''}}

/* Downloads (offline) */
async function download(t,quiet){if(t.offline){if(!quiet)toast('Ya está descargada');return true}if(dlState.has(t.id))return false;dlState.set(t.id,1);refreshRows();updateUI();try{return await download_(t,quiet)}finally{dlState.delete(t.id);refreshRows();updateUI()}}
async function download_(t,quiet){
 if(t.source==='yt'&&!state.api){toast('Conecta el servidor para descargar');return false}
 if(!quiet)toast('Descargando “'+t.title+'”…');
 try{let r;try{r=await fetch(t.source==='yt'?streamURL(t):(NATIVE?iaProxyURL(t):iaURL(t)));if(!r.ok)throw new Error(String(r.status))}
  catch(e){if(t.source==='ia'&&state.api){r=await fetch(iaProxyURL(t));if(!r.ok)throw e}else throw e}
  const blob=await r.blob();if(blob.size<20000)throw new Error('vacío');
  if(db)await put('audio',t.id,blob);else mem.audio.set(t.id,blob);t.offline=true;t.size=blob.size;saveRemote();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if(!quiet)toast('Descargada: '+t.title);refreshRows();return true}
 catch(e){console.warn(e);if(!quiet)toast('No se pudo descargar “'+t.title+'”');return false}}
async function removeDownload(t){mem.audio.delete(t.id);await del('audio',t.id);t.offline=false;saveRemote();toast('Descarga eliminada');refreshRows()}

function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;
 while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}
 return e+(a.length-i)+(b.length-j)<=1}
function localSearch(q){const terms=norm(q).split(/[^a-z0-9ñ]+/).filter(Boolean);if(!terms.length)return [];const out=[];
 for(const t of state.tracks){const words=norm(`${t.title} ${t.artist} ${t.album} ${t.albumArtist||''} ${t.genre}`).split(/[^a-z0-9ñ]+/).filter(Boolean);let score=0,ok=true;
  for(const term of terms){let best=0;for(const w of words){if(w===term){best=3;break}if(w.startsWith(term))best=Math.max(best,2);else if(term.length>=4&&(lev1(w,term)||lev1(w.slice(0,term.length),term)))best=Math.max(best,1)}
   if(!best){ok=false;break}score+=best}
  if(ok)out.push([score,t])}
 return out.sort((a,b)=>b[0]-a[0]).map(x=>x[1]).slice(0,40)}

const IAF='mediatype:audio AND format:(Flac OR "24bit Flac")';
const words_=s=>norm(s).replace(/[^a-z0-9ñ\s]/g,' ').split(/\s+/).filter(w=>w.length>1);
async function iaFlex(q,yt){const res=new Map();const addAll=l=>(l||[]).forEach(x=>{if(!res.has(x.id))res.set(x.id,x)});const W=words_(q);
 if(W.length)addAll(await iaSearch('',25,`(${W.join(' AND ')}) AND ${IAF}`).catch(()=>[]));
 const top=yt&&((yt.top&&yt.top.kind==='song')?yt.top:(yt.songs||[])[0]);
 if(res.size<3&&top){const ar=words_((top.artist||'').split(',')[0]);const ti=words_(top.title).filter(w=>w.length>2).slice(0,5);
  if(ar.length)addAll(await iaSearch('',15,`creator:(${ar.join(' AND ')}) AND ${IAF}`).catch(()=>[]));
  if(ti.length)addAll(await iaSearch('',15,`title:(${ti.join(' AND ')}) AND ${IAF}`).catch(()=>[]))}
 if(!res.size&&W.length){const fz=W.filter(w=>w.length>3).map(w=>w+'~1');if(fz.length)addAll(await iaSearch('',15,`(${fz.join(' AND ')}) AND ${IAF}`).catch(()=>[]))}
 return iaRelevant([...res.values()],q,top).slice(0,30)}
function iaRelevant(list,q,top){const W=words_(q);const TW=top?words_(top.title+' '+String(top.artist||'').split(',')[0]).filter(w=>w.length>2):[];
 const has=(hay,w)=>hay.some(h=>h===w||h.startsWith(w)||(w.length>=4&&lev1(h,w)));
 return list.filter(x=>{const hay=words_(x.title+' '+x.artist);const qh=W.filter(w=>has(hay,w)).length;const th=TW.filter(w=>has(hay,w)).length;
  return (W.length&&qh>=Math.ceil(W.length*0.6))||(TW.length&&th>=Math.min(2,TW.length))})}

 let songs=[],ctx='ysr';
 if(y){const list=[];if(y.top&&y.top.kind==='song')list.push(y.top);list.push(...(y.songs||[]));if(tab==='songs')list.push(...(y.videos||[]));songs=list.map(ytTrack);ctx=setCtx('ysr',songs.map(t=>t.id),'Búsqueda: '+q)}

 if(y&&y.corrected)h+=`<p class="note">Mostrando resultados para <b style="color:var(--tx)">${esc(y.corrected)}</b></p>`;
 else if(y&&y.didYouMean)h+=`<p class="note">¿Quisiste decir <button class="lnk" data-act="sugo" data-q="${esc(y.didYouMean)}">${esc(y.didYouMean)}</button>?</p>`;
 const ytBlock=(fn)=>{if(d.ytErr)return `<div class="flacnote"><b>No se pudo buscar en YouTube Music.</b><br>${esc(d.ytErr)}<div class="btns"><button class="btn sm" data-act="sretry">Reintentar</button></div></div>`;if(!y)return skel(4);return fn()};

 if(tab==='all'){

 el.innerHTML=`<div class="sh-btns" style="justify-content:flex-start;padding-bottom:10px"><button class="btn sm" data-act="recsq" data-ctx="${c}">${ic('queue',16)}Añadir todas a la cola</button></div>`+ts.map((x,i)=>row(x,i,c)).join('');hydrate(el)}
Object.assign(A,{
 precs:()=>recsSheet(),
 recsq:el=>{addQueue(ctxIds(el));sheetBack()},
 pdl:()=>{const t=cur();if(t&&isRemote(t)&&!t.offline)download(t).then(()=>updateUI());else if(t&&t.offline)toast('Ya está descargada para escuchar sin conexión')},
});
/* ================= Boot ================= */
async function boot(){
 const ok=await openDB();
 if(ok){const ts=await getAll('tracks');state.tracks=(ts||[]).sort((a,b)=>a.added-b.added);state.tracks.forEach(t=>state.byId.set(t.id,t));
  const likes=await get('kv','likes');if(likes)state.likes=new Set(likes);const pl=await get('kv','playlists');if(pl)state.playlists=pl;const rc=await get('kv','recent');if(rc)state.recent=rc;
  const st=await get('kv','settings');if(st)Object.assign(state.settings,st);
  const hs=await get('kv','hist');if(Array.isArray(hs))state.hist=hs;
  const rm=await get('kv','remote');if(Array.isArray(rm))rm.forEach(t=>state.byId.set(t.id,t));
  const ss=await get('kv','session');if(ss&&ss.queue&&ss.queue.length){state.queue=ss.queue.filter(id=>state.byId.has(id));state.source=ss.source||'';state.shuffle=!!ss.shuffle;state.repeat=ss.repeat||'off';state.orig=ss.orig||null;
   if(state.queue.length){const qi=Math.max(0,Math.min(state.queue.indexOf(ss.queue[ss.qi]),state.queue.length-1));loadTrack(qi<0?0:qi,false,ss.t||0)}}}
 else toast('Tu navegador no permite guardar datos: la música se perderá al cerrar',4000);
 render(true);updateUI();
 detectServer().then(()=>{const v=topView();const typing=document.activeElement&&document.activeElement.id==='q';if(!typing&&['home','search'].includes(v.name))render()});
 if(!NATIVE&&'serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
const bootP=boot();
</script>
