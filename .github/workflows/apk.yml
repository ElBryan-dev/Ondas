name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar
        env:
          KS_PASS: ondas-ZWEMqA4iVsX0
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          {
            npm ci
            npm run build
            npx cap sync android
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
            cd ..
            cp android/app/build/outputs/apk/release/app-release.apk Ondas.apk
          } 2>&1 | tee build.log

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Ondas 1.${{ github.run_number }}
          make_latest: true
          files: Ondas.apk
          body: |
            Descarga **Ondas.apk** en tu teléfono Android y ábrelo para instalar.
            Si Android lo pide, permite instalar apps de esta fuente.

      - name: Guardar registro de error
        if: failure()
        run: |
          [ -f build.log ] || echo "sin registro" > build.log
          tail -c 300000 build.log > /tmp/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/build-log.txt build-log.txt
          git add build-log.txt
          git commit -m "Registro de compilación ${{ github.run_number }}"
          git push -f origin ci-log
